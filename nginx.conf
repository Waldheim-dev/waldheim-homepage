# on alpine, copy to /etc/nginx/nginx.conf
user                            root;
worker_processes                auto;

error_log                       /var/log/nginx/error.log warn;

events {
    worker_connections          1024;
}

http {
    include                     /etc/nginx/mime.types;
    default_type                application/octet-stream;
    sendfile                    off;
    access_log                  off;
    keepalive_timeout           3000;
    server {
        listen                  8084;
        root                    /usr/share/nginx/html;
        index                   index.html;
        server_name             localhost;
        client_max_body_size    16m;
        absolute_redirect       off;

        # HTTP 301 Redirects für alte Produkt-URLs & doppelte Seite-1-Archive (GSC Fix)
        rewrite ^/silvacore/?$ /suite/forge/ permanent;
        rewrite ^/suite/silvacore/?$ /suite/forge/ permanent;
        rewrite ^/suite/portal/?$ /suite/ permanent;
        rewrite ^/ecodrive/?$ /suite/ecodrive/ permanent;
        rewrite ^/socialverse/?$ /suite/socialverse/ permanent;
        rewrite ^/aether/?$ /suite/aether/ permanent;
        rewrite ^/blog/1/?$ /blog/ permanent;
        rewrite ^/referenzen/1/?$ /referenzen/ permanent;
    }
}