version: '3'
services:
  wd-web:
    build:
      context: .
      args:
        PORT: ${WEB_PORT}
    restart: unless-stopped
    container_name: "wd-web"
    labels:
      - "traefik.enable=true"
      - traefik.http.routers.wd-web-http.rule=Host(`waldheim.dev`) || Host(`www.waldheim.dev`)
      - traefik.http.routers.wd-web-http.entrypoints=http
      - traefik.http.routers.wd-web-http.middlewares=redirect-to-https
      - traefik.http.routers.wd-web-https.rule=Host(`waldheim.dev`) || Host(`www.waldheim.dev`)
      - traefik.http.routers.wd-web-https.entrypoints=https
      - traefik.http.routers.wd-web-https.tls=true
      - traefik.http.routers.wd-web-https.tls.certresolver=letsencrypt
      - "traefik.http.routers.wd-web.service=wd-web-waldheimdevhomepage"
      - traefik.http.routers.wd-web-https.middlewares=redirect-to-non-www
      - traefik.http.services.waldheimdevhomepage.loadbalancer.server.port=80
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true
      - traefik.http.middlewares.redirect-to-non-www.redirectregex.regex=^https?://www.waldheim.dev/(.*)
      - traefik.http.middlewares.redirect-to-non-www.redirectregex.replacement=https://waldheim.dev/$${1}
      - traefik.http.middlewares.redirect-to-non-www.redirectregex.permanent=true
    ports:
      - 8084:80
    env_file: .env
    environment:
      PORT: ${WEB_PORT}
      NGINX_PORT: ${WEB_PORT}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./:/opt/app
      - /pnpm:/pnpm
    networks:
      - proxy
      - default


networks:
  proxy:
    external:
      name: proxy
  default:
    driver: bridge
