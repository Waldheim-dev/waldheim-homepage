version: '3'
services:
  wd-web:
    build:
      context: .
      args:
        PORT: ${WEB_PORT}
    restart: unless-stopped
    container_name: "wd-web"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wd-web.rule=Host(`waldheim.dev`) || Host(`www.waldheim.dev`)"
      - "traefik.http.routers.wd-web.service=wd-web-waldheimdevhomepage"
      - "traefik.http.routers.wd-web.tls.certresolver=lets-encrypt"
      - "traefik.http.services.wd-web-waldheimdevhomepage.loadbalancer.server.port=8084"
      - "traefik.http.routers.wd-web.tls.domains[0].main=waldheim.dev"
      - "traefik.http.routers.wd-web.tls.domains[0].sans=www.waldheim.dev"
    ports:
      - 8084:80
    env_file: .env
    environment:
      PORT: ${WEB_PORT}
      NGINX_PORT: ${WEB_PORT}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./:/opt/app
      - ./dist:/usr/share/nginx/html
    networks:
      - proxy
      - default


networks:
  proxy:
    external:
      name: proxy
  default:
    driver: bridge
