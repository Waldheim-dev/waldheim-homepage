version: '3'
services:
  wd-web:
    build:
      context: .
      args:
        PORT: ${WEB_PORT}
    restart: unless-stopped
    container_name: "wd-web"
    labels:
      - traefik.enable=true
      - traefik.http.routers.wd-web.rule=Host(`www.waldheim.dev`) || Host(`*.waldheim.dev`) || Host(`waldheim.dev`)
      - traefik.http.routers.wd-web.entrypoints=websecure,web
      - traefik.http.routers.wd-web.service=wd-web-waldheimdevhomepage
      - traefik.http.routers.wd-web.tls.certresolver=lets-encrypt
      - traefik.http.services.wd-web-waldheimdevhomepage.loadbalancer.server.port=8084
      - traefik.docker.network=proxy
    ports:
      - 8084:${WEB_PORT}
    env_file: .env
    environment:
      PORT: ${WEB_PORT}
      NODE_ENV: ${NODE_ENV}
    volumes:
      - ./:/opt/app
    networks:
      - proxy
      - default


networks:
  proxy:
    external:
      name: proxy
  default:
    driver: bridge
