name: CI · Release · Deploy

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ──────────────────────────────────────────
  # Job 1: QA — Node, lint, Astro build
  # Runs on every push and every PR
  # ──────────────────────────────────────────
  qa:
    name: QA (Node · Lint · Build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from "packageManager" in package.json automatically

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true   # warnings don't block, script may not exist yet

      - name: Astro build
        run: pnpm build

      # Optionally upload the artifact (controlled by repository variable)
      # Disable if you hit artifact storage quota: set UPLOAD_ARTIFACTS=false in repo settings
      - name: Upload dist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.UPLOAD_ARTIFACTS != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: homepage-dist
          path: dist/
          retention-days: 1
          compression-level: 9
          overwrite: true

  # ──────────────────────────────────────────
  # Job 2: Semantic Release
  # Only on push to main or next; requires QA to pass
  # ──────────────────────────────────────────
  release:
    name: Semantic Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create tags + GitHub Release
      issues: write           # close issues mentioned in commits
      pull-requests: write    # comment on merged PRs

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history needed for semantic-release
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        # version is read from "packageManager" in package.json automatically

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the bot identity for release commits
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx semantic-release

  # ──────────────────────────────────────────
  # Job 3: Deploy via SFTP to IONOS
  # Only on push to main or next; runs after release
  # (deploys even if no new version was published)
  #
  # Required repository secrets:
  #   FTP_HOST      → IONOS SFTP server hostname
  #   FTP_USER      → IONOS SFTP username
  #   FTP_PASSWORD  → IONOS SFTP password
  #
  # Optional repository variable:
  #   FTP_SERVER_DIR → remote target directory (default: /websites/waldheim.dev/www/)
  # ──────────────────────────────────────────
  deploy:
    name: Deploy → IONOS (FTP)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [qa, release]
    runs-on: ubuntu-latest
    environment: FTP_PASSWORD

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for deployment
        run: pnpm build

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: SFTP Deploy to IONOS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ vars.FTP_SERVER_DIR || '/websites/waldheim.dev/www/' }}
        run: |
          lftp -c "
            set sftp:auto-confirm yes
            set net:max-retries 3
            set net:reconnect-interval-base 5
            open sftp://$FTP_USER:$FTP_PASS@$FTP_HOST
            mirror --reverse --delete --verbose ./dist/ $REMOTE_DIR
            bye
          "
