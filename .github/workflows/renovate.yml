# This code has been fully generated by an AI.
name: Renovate

on:
  schedule:
    - cron: "0 5 * * 1"
  issues:
    types: [edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-refs/heads/main
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    if: github.event_name != 'issues' || (github.event.issue.title == 'Dependency Dashboard' && github.actor != 'github-actions[bot]' && github.actor != 'renovate[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record current main SHA
        id: before
        run: |
          git fetch origin main
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN != '' && secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'optional'
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <29139614+renovate[bot]@users.noreply.github.com>'

      - name: Complete remaining Renovate automerge passes
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN != '' && secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'optional'
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <29139614+renovate[bot]@users.noreply.github.com>'
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          git fetch origin main
          PREV_SHA="${BEFORE_SHA}"
          CURR_SHA=$(git rev-parse origin/main)
          PASS=1
          while [ "$PREV_SHA" != "$CURR_SHA" ] && [ "$PASS" -lt 10 ]; do
            PASS=$((PASS + 1))
            echo "main advanced ($PREV_SHA -> $CURR_SHA) — running Renovate pass #$PASS to finish remaining branch automerges and dashboard sync"
            PREV_SHA="$CURR_SHA"
            docker run \
              --env RENOVATE_REPOSITORIES \
              --env RENOVATE_ONBOARDING \
              --env RENOVATE_REQUIRE_CONFIG \
              --env RENOVATE_GIT_AUTHOR \
              --env RENOVATE_TOKEN \
              --env FORCE_COLOR=3 \
              --volume /tmp:/tmp \
              --rm ghcr.io/renovatebot/renovate:44
            git fetch origin main
            CURR_SHA=$(git rev-parse origin/main)
          done

      - name: Trigger CI if Renovate automerged commits to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
        run: |
          git fetch origin main
          AFTER_SHA=$(git rev-parse origin/main)
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "main advanced from $BEFORE_SHA to $AFTER_SHA — dispatching CI · Release · Deploy"
            gh workflow run ci.yml --ref main
          else
            echo "main unchanged ($AFTER_SHA)"
          fi
