build_version_container:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/doc/Dockerfile"
    - if: $CI_COMMIT_BRANCH == "alpha"
      changes:
        - "**/doc/Dockerfile"
    - if: $CI_COMMIT_BRANCH == "beta"
      changes:
        - "**/doc/Dockerfile"
    - if: $CI_COMMIT_BRANCH == "next"
      changes:
        - "**/doc/Dockerfile"
    - if: $CI_COMMIT_BRANCH == "next-major"
      changes:
        - "**/doc/Dockerfile"
    - if: $CI_COMMIT_BRANCH == "+([0-9])?(.{+([0-9]),x}).x"
      changes:
        - "**/doc/Dockerfile"

  variables:
    DOCKER_FILDER: .ci/doc/
  tags:
    - docker
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY/mwaldheim/waldheim.dev.homepage/version:latest $DOCKER_FILDER.
    - docker push $CI_REGISTRY/mwaldheim/waldheim.dev.homepage/version:latest


fetch-semantic-version:
  image: registry.gitlab.com/mwaldheim/waldheim.dev.homepage/version
  stage: build
  needs:
    - job: build_version_container
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "alpha"
    - if: $CI_COMMIT_BRANCH == "beta"
    - if: $CI_COMMIT_BRANCH == "next"
    - if: $CI_COMMIT_BRANCH == "next-major"
    - if: $CI_COMMIT_BRANCH == "+([0-9])?(.{+([0-9]),x}).x"
  script:
    - npx semantic-release --generate-notes false --dry-run
  tags:
    - docker
  artifacts:
    paths:
      - package.json
      - CHANGELOG.md

release:
  image: registry.gitlab.com/mwaldheim/waldheim.dev.homepage/version
  stage: deploy
  needs:
    - job: fetch-semantic-version
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "alpha"
    - if: $CI_COMMIT_BRANCH == "next"
    - if: $CI_COMMIT_BRANCH == "next-major"
    - if: $CI_COMMIT_BRANCH == "+([0-9])?(.{+([0-9]),x}).x"
  script:
    - touch CHANGELOG.md
    - npx semantic-release
  artifacts:
    paths:
      - package.json
      - CHANGELOG.md
      - dist/*.zip
