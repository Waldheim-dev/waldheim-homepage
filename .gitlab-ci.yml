
stages:
  - '.pre'
  - prepare
  - test
  - build
  - release
  - prepare-deploy
  - deploy
  - canary
  - staging
  - production
  - review
  - dast
  - performance
  - cleanup
  - '.post'

include:
  - component: $CI_SERVER_FQDN/forestdesign/ci-components/node-install@~latest
    inputs:
      command: npm install
      image: registry.gitlab.com/forestdesign/ci-components/node:latest
  - component: $CI_SERVER_FQDN/forestdesign/ci-components/node-build@~latest
    inputs:
      command: npm run build
      image: registry.gitlab.com/forestdesign/ci-components/node:latest
  - component: $CI_SERVER_FQDN/forestdesign/ci-components/node-semantic@~latest
    inputs:
      command: npx semantic-release
      image: registry.gitlab.com/forestdesign/ci-components/node:latest     
  - component: $CI_SERVER_FQDN/forestdesign/ci-components/deploy-sftp@~latest
    inputs:
      rules:
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      remote-dir: /websites/waldheim.dev/www
  - component: $CI_SERVER_FQDN/forestdesign/ci-components/deploy-sftp@~latest
    inputs:
      name: deploy-next
      remote-dir: /websites/waldheim.dev/next
      rules:
        - if: $CI_COMMIT_BRANCH == "next"

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
sonarcloud-check:
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  only:
    - merge_requests
    - main
    - develop
