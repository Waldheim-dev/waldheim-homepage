deploy-hosting:
  stage: production
  image:
    name: registry.gitlab.com/mwaldheim/container/sshdeploy
    entrypoint: [""]
  script:
    - mkdir -p ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
    - ssh -o StrictHostKeyChecking=no -p $SSH_PORT $SSH_USER@$SSH_HOST "sudo -s cd $SSH_PATH && sudo -s git pull && sudo -s docker-compose down && sudo -s docker-compose up -d"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
    - when: never


